<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1410" viewBox="0 0 480 1410" role="img" aria-labelledby="title desc">
<title id="title">Zero, undefined and unknown are different cost states</title><desc id="desc">Three fictional cases for the AI workflow cost ledger. Explicit zero in every cost category and one caller-accepted result gives zero unit cost. Total cost of one currency unit with no accepted results gives undefined unit cost, while the total cost remains one. A missing required cost causes an input error, not a zero-cost result. Include all failed attempts and retries; acceptance and costs are supplied by the caller.</desc>
<rect width="480" height="1410" rx="20" fill="#f1f8f4"/>
<g font-family="Sora,Arial,sans-serif" fill="#193e45">
<text x="24" y="35" font-size="15" font-weight="400">AHMADREZA SAMADI</text>
<text x="24" y="60" font-size="15" font-weight="400">START WITH THE DECISION</text>
<text x="24" y="103" font-size="27" font-weight="600">Zero, undefined</text>
<text x="24" y="137" font-size="27" font-weight="600">and unknown</text>
<text x="24" y="171" font-size="27" font-weight="600">are different cost states.</text>
<text x="24" y="209" font-size="20" font-weight="400">Cost per caller-accepted AI result</text>
<text x="24" y="237" font-size="18" font-weight="400">Fictional teaching cases</text>
<rect x="24" y="260" width="432" height="270" rx="16" fill="#dfeee7"/>
<text x="44" y="302" font-size="24" font-weight="600">Known zero</text>
<text x="44" y="340" font-size="20" font-weight="400">Every required cost</text>
<text x="44" y="366" font-size="20" font-weight="400">is explicitly zero.</text>
<text x="44" y="405" font-size="20" font-weight="400">Accepted results: 1</text>
<text x="44" y="449" font-size="27" font-weight="600">0 ÷ 1 = 0</text>
<text x="44" y="485" font-size="19" font-weight="400">Zero unit cost is valid</text>
<text x="44" y="510" font-size="19" font-weight="400">only for recorded costs.</text>
<rect x="24" y="546" width="432" height="270" rx="16" fill="#e4eefb"/>
<text x="44" y="588" font-size="24" font-weight="600">None accepted</text>
<text x="44" y="626" font-size="20" font-weight="400">Total recorded cost:</text>
<text x="44" y="652" font-size="20" font-weight="400">1 currency unit</text>
<text x="44" y="691" font-size="20" font-weight="400">Accepted results: 0</text>
<text x="44" y="735" font-size="27" font-weight="600">1 ÷ 0: undefined</text>
<text x="44" y="771" font-size="19" font-weight="400">Unit cost is null.</text>
<text x="44" y="796" font-size="19" font-weight="400">Total spend is still 1.</text>
<rect x="24" y="832" width="432" height="270" rx="16" fill="#dfeee7"/>
<text x="44" y="874" font-size="24" font-weight="600">Missing cost</text>
<text x="44" y="912" font-size="20" font-weight="400">At least one required</text>
<text x="44" y="938" font-size="20" font-weight="400">cost field is blank.</text>
<text x="44" y="977" font-size="20" font-weight="400">No valid summary</text>
<text x="44" y="1021" font-size="27" font-weight="600">Input error</text>
<text x="44" y="1057" font-size="19" font-weight="400">Do not fill an unknown</text>
<text x="44" y="1082" font-size="19" font-weight="400">cost with zero.</text>
<text x="24" y="1146" font-size="18" font-weight="400">Total cost includes all attempts,</text>
<text x="24" y="1172" font-size="18" font-weight="400">failures and retries.</text>
<text x="24" y="1209" font-size="18" font-weight="400">Divide by distinct accepted result IDs—</text>
<text x="24" y="1235" font-size="18" font-weight="400">not the number of attempts.</text>
<text x="24" y="1283" font-size="18" font-weight="400">Costs and acceptance labels are caller-recorded,</text>
<text x="24" y="1309" font-size="18" font-weight="400">not independently verified.</text>
<text x="24" y="1347" font-size="18" font-weight="400">One currency label; no currency conversion.</text>
<text x="24" y="1373" font-size="18" font-weight="400">AI-assisted educational diagram.</text>
</g></svg>
